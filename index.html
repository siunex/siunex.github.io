A.team=()=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class=md><h3>👥 Agentlar jamoasi</h3><small>Topshiriq bering — agentlar rejani bo'lib, birgalikda bajaradi.</small><textarea id=tmT rows=3 placeholder="Masalan: YouTube kanalim uchun 1 haftalik kontent reja va 1-video ssenariysini tayyorla"></textarea><div style="margin:8px 0;max-height:200px;overflow:auto">${S.agents.map(a=>`<label class=row style="justify-content:flex-start;gap:8px;padding:4px 0"><input type=checkbox class=tmA value="${esc(a.n)}" ${a.on?'checked':''} style="width:auto"> ${esc(a.n)}</label>`).join('')}</div><div class=row><button class="btn g" data-c=1>Bekor</button><button class=btn data-s=1>▶ Boshlash</button></div></div>`;d.onclick=e=>{if(e.target==d||e.target.dataset.c)d.remove();if(e.target.dataset.s){const t=$('#tmT').value.trim(),ns=[...d.querySelectorAll('.tmA:checked')].map(x=>x.value);if(!t||ns.length<2){toast('Topshiriq yozing va kamida 2 ta agent tanlang');return}d.remove();runTeam(t,ns)}};document.body.appendChild(d)};
async function runTeam(task,names){if(busy)return;const c=cur();c.msgs.push({r:'u',t:'👥 Jamoa: '+task});const b={r:'a',t:''};c.msgs.push(b);busy=1;page='chat';const up=x=>{b.t=x;const e=$('#msgs .m:last-child');if(e){e.innerHTML=md(b.t);$('#msgs').scrollTop=1e9}};R();
const call=async p=>{if(!sample&&window.claude)sample=await claude.use('sample');if(!sample)throw{code:'na'};return(await sample([{role:'user',content:p}])).text};
try{const ag=names.map(n=>{const a=S.agents.find(x=>x.n==n)||{};return{n,d:a.d||'',p:a.p||ROLE[n]||''}});
up('🧠 Rahbar reja tuzmoqda...');
let plan;try{const j=await call(`Sen jamoa rahbarisan. Topshiriq: "${task}"\nJamoa agentlari:\n${ag.map(a=>'- '+a.n+': '+a.d).join('\n')}\nTopshiriqni 2-4 bosqichga bo'l, har biriga mos agentni tayinla. FAQAT JSON qaytar: {"steps":[{"agent":"agent nomi","task":"aniq vazifa"}]}`);plan=JSON.parse(j.slice(j.indexOf('{'),j.lastIndexOf('}')+1)).steps.filter(x=>x&&x.task).slice(0,4)}catch(e){plan=ag.slice(0,3).map(a=>({agent:a.n,task}))}
let log='',res=[];for(let i=0;i<plan.length;i++){const st=plan[i],a=ag.find(x=>x.n==st.agent)||ag[i%ag.length];up(log+`▶ **${i+1}/${plan.length} ${a.n}** ishlayapti...`);const prev=res.map(r=>`[${r.n}] ${r.o.slice(0,1200)}`).join('\n\n');const o=await call(`${a.p}\nSen "${a.n}" agentisan, jamoa bilan ishlayapsan. Umumiy maqsad: ${task}\n${prev?'Oldingi agentlar natijalari:\n'+prev+'\n':''}Sening vazifang: ${st.task}\nTo'liq, aniq natija ber (o'zbek tilida, agar boshqa so'ralmasa).`);res.push({n:a.n,t:st.task,o});log+=`✅ ${i+1}/${plan.length} ${a.n}: ${st.task}\n\n`;up(log)}
up(log+'🧩 Yakuniy javob tayyorlanmoqda...');
const fin=await call(`Jamoa natijalarini birlashtirib, foydalanuvchi uchun YAKUNIY aniq javob yoz.\nTopshiriq: ${task}\n\n${res.map(r=>'### '+r.n+' ('+r.t+')\n'+r.o).join('\n\n')}`);
b.t=fin+'\n\n---\n**Jamoa ishi:** '+res.map(r=>r.n).join(' → ')}catch(e){b.t=b.t||(e.code=='nokey'?"Settings bo'limida Anthropic API kalitini kiriting.":'Jamoa ishida xato: '+(e.m||e.message||'AI mavjud emas'))}
busy=0;save();R()}
